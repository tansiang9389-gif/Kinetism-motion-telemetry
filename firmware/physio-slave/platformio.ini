; Physio_A forearm slave: ESP-NOW sender for the paired-arm sensors.
; Build:  pio run -d firmware/physio-slave
; Flash:  pio run -d firmware/physio-slave -t upload --upload-port COMx
[env:esp32c3]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
lib_deps =
    sparkfun/SparkFun BNO080 Cortex Based IMU@1.1.12
