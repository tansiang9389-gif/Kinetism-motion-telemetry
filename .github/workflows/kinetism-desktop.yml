name: Kinetism Desktop

on:
  pull_request:
    paths:
      - "apps/kinetism_desktop/**"
      - ".github/workflows/kinetism-desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/kinetism_desktop/**"
      - ".github/workflows/kinetism-desktop.yml"
    # Path filters are not evaluated for tag pushes, so every v* tag builds.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: apps/kinetism_desktop

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/kinetism_desktop
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  release:
    name: Windows release zip
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/kinetism_desktop
      - run: cargo build --release --locked
      - name: Package zip
        shell: pwsh
        run: |
          $pkg = "kinetism-desktop-$env:GITHUB_REF_NAME-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$pkg" | Out-Null
          Copy-Item target/release/kinetism_desktop.exe, README.md -Destination "dist/$pkg/"
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip" -Force
          "ASSET=apps/kinetism_desktop/dist/$pkg.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" \
              --title "Kinetism Desktop $TAG" --generate-notes
          fi
